<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Closing</title>
<link rel="stylesheet" href="theme.css" />
<style>
  .closing-page { justify-content: center; align-items: flex-start; gap: 40px; }
  .closing-message {
    font-size: 32px;
    font-weight: var(--weight-bold);
    color: var(--text-primary);
    max-width: 720px;
    line-height: 1.4;
  }
  .closing-sub {
    margin-top: 4px;
    font-size: 15px;
    color: var(--text-secondary);
    max-width: 640px;
    line-height: 1.6;
  }
  .contact-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    width: 100%;
  }
  .contact-card {
    background: var(--surface-2);
    border: 1px solid var(--border-hairline);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .contact-card .c-label {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--color-primary);
  }
  .contact-card .c-value {
    font-size: 13px;
    font-weight: var(--weight-medium);
    color: var(--text-primary);
    word-break: break-all;
  }
</style>
</head>
<body>
  <main class="page closing-page">
    <div class="page-header">
      <span class="brand">PORTFOLIO · 김지오</span>
      <span>CLOSING</span>
    </div>

    <div style="margin-top: 40px;">
      <span class="eyebrow">Thank you</span>
      <div class="closing-message">끝까지 읽어주셔서 감사합니다.</div>
      <p class="closing-sub">
        문제의 원인을 끝까지 추적하고, 반복을 자동화하며, 기록으로 다음 문제를 더 빠르게 푸는
        엔지니어 김지오였습니다. 아래 연락처로 편하게 연락 주세요.
      </p>
    </div>

    <div class="contact-grid">
      <div class="contact-card">
        <span class="c-label">Email</span>
        <span class="c-value">gdevo6264@gmail.com</span>
      </div>
      <div class="contact-card">
        <span class="c-label">Phone</span>
        <span class="c-value">010-****-7243</span>
      </div>
      <div class="contact-card">
        <span class="c-label">GitHub</span>
        <span class="c-value">github.com/sohappytoday</span>
      </div>
      <div class="contact-card">
        <span class="c-label">Blog</span>
        <span class="c-value">velog.io/@geooeg/posts</span>
      </div>
    </div>

    <div class="page-footer">
      <span>김지오 · DevOps / Cloud Engineer</span>
      <span class="page-num">13 / 13</span>
    </div>
  </main>
</body>
</html>
